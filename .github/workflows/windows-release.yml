name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qtcharts qtwebsockets"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item build/Release/qtconsole.exe deploy/
          windeployqt --release --dir deploy deploy/qtconsole.exe

      - name: Create zip
        shell: pwsh
        run: |
          if (Test-Path qtconsole-windows.zip) { Remove-Item qtconsole-windows.zip -Force }
          Compress-Archive -Path deploy/* -DestinationPath qtconsole-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtconsole-windows
          path: qtconsole-windows.zip

      - name: Publish Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qtconsole-windows.zip
